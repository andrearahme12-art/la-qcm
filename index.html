<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QCM : Fragilités et puissance de Los Angeles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF3F7;--surface:#FFFFFF;--ink:#12202B;--muted:#4A6070;--line:#C3D8E3;
  --accent:#0E4A6B;--on-accent:#FFFFFF;--orange:#E8862A;--red:#D6452F;
  --ok:#1F7A4D;--okbg:#DDF3E6;--bad:#B3321E;--badbg:#FBE1DC;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0A1822;--surface:#10293A;--ink:#EAF3F7;--muted:#9DB6C5;--line:#24445A;
    --accent:#F6C945;--on-accent:#12202B;--red:#E0533C;
    --ok:#5BD08F;--okbg:#123826;--bad:#FF8A75;--badbg:#3A1B16;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A1822;--surface:#10293A;--ink:#EAF3F7;--muted:#9DB6C5;--line:#24445A;
  --accent:#F6C945;--on-accent:#12202B;--red:#E0533C;
  --ok:#5BD08F;--okbg:#123826;--bad:#FF8A75;--badbg:#3A1B16;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:20px 20px 48px}
h1,h2{font-family:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;margin:0;line-height:1.12}
h1{font-size:clamp(2.1rem,9vw,3rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.4rem;font-weight:600;line-height:1.25;outline:none}
.lead{color:var(--muted);margin:16px 0 28px}
.lane{position:relative;margin:36px 14px 28px}
.road{height:14px;border-radius:7px;background:var(--red);position:relative;overflow:hidden}
.road::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;transform:translateY(-50%);background:repeating-linear-gradient(90deg,#fff 0 10px,transparent 10px 20px);opacity:.9}
.car{position:absolute;top:-21px;left:0;font-size:24px;line-height:1;transform:translateX(-50%) scaleX(-1);transition:left .5s ease}
.intro .car{transition:none;animation:drive 2.6s cubic-bezier(.3,.6,.3,1) both}
@keyframes drive{from{left:0}to{left:100%}}
@media (prefers-reduced-motion:reduce){.car,.intro .car{transition:none;animation:none}}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:14px 24px;min-height:48px;background:var(--accent);color:var(--on-accent);cursor:pointer}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.credit{margin:40px 0 0;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:.92rem}
.bar{display:flex;justify-content:space-between;color:var(--muted);font-size:.95rem;font-weight:600}
#opts{margin-top:20px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;margin:0 0 10px;padding:12px 14px;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default;color:var(--ink)}
.opt .l{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--bg);border:1px solid var(--line);font-weight:600;font-size:.95rem}
.opt .mark{margin-left:auto;font-weight:800;font-size:1.2rem}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.ok .mark{color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt.bad .mark{color:var(--bad)}
.fb{margin-top:18px;padding:14px 16px 16px;background:var(--surface);border-left:5px solid var(--orange);border-radius:0 12px 12px 0}
.fb strong{display:block;font-size:1.05rem}
.fb span{display:block;margin:2px 0 14px;color:var(--muted)}
#review{list-style:none;margin:12px 0 28px;padding:0}
#review li{padding:12px 14px;margin-bottom:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
#review li strong{display:block;font-weight:600}
#review li span{display:block;color:var(--ok);font-weight:600;margin-top:2px}
#final{font-size:clamp(2.6rem,12vw,3.6rem);font-weight:800;letter-spacing:-.02em}
#revwrap h2{font-size:1.15rem;margin-top:28px}
</style>
</head>
<body>
<main class="wrap">

<section id="start">
  <div class="lane intro" aria-hidden="true"><div class="road"></div><span class="car">🚗</span></div>
  <h1>Fragilités et puissance de Los Angeles</h1>
  <p class="lead">Quels sont les différents visages de Los Angeles ? Répondez à 12 questions pour le découvrir.</p>
  <button class="btn" id="go" type="button">Jouer</button>
  <p class="credit">Présenté par Andrea Rahme (n°19) et Lea Hajj Mousse (n°9)</p>
</section>

<section id="game" hidden>
  <div class="bar"><span id="count"></span><span id="score"></span></div>
  <div class="lane" aria-hidden="true"><div class="road"></div><span class="car" id="car">🚗</span></div>
  <h2 id="qtext" tabindex="-1"></h2>
  <div id="opts" role="group" aria-labelledby="qtext"></div>
  <div id="fb" class="fb" hidden aria-live="polite">
    <strong id="verdict"></strong>
    <span id="why"></span>
    <button class="btn" id="next" type="button"></button>
  </div>
</section>

<section id="end" hidden>
  <div class="lane" aria-hidden="true"><div class="road"></div><span class="car" style="left:100%">🚗</span></div>
  <h1 id="final"></h1>
  <p class="lead" id="msg"></p>
  <div id="revwrap">
    <h2>À revoir</h2>
    <ul id="review"></ul>
  </div>
  <button class="btn" id="again" type="button">Rejouer</button>
  <p class="credit">Présenté par Andrea Rahme (n°19) et Lea Hajj Mousse (n°9)</p>
</section>

</main>
<script>
(function(){
var Q=[
{q:"Combien d’habitants compte Los Angeles ?",o:["5 millions","15 millions","50 millions"],a:1,e:"Los Angeles compte 15 millions d’habitants."},
{q:"Où se trouve Los Angeles ?",o:["Sur la côte est des États-Unis","Sur la côte ouest, face au Pacifique","Au Canada"],a:1,e:"Los Angeles est sur la côte ouest des États-Unis, face à l’océan Pacifique."},
{q:"Que signifie CBD ?",o:["Centre de banlieue défavorisée","Quartier d’affaires","Quartier résidentiel"],a:1,e:"CBD vient de Central Business District : le quartier d’affaires."},
{q:"Comment appelle-t-on le centre-ville aux États-Unis ?",o:["Suburbs","Ghetto","Downtown"],a:2,e:"Le downtown est le centre-ville aux États-Unis."},
{q:"Que signifie « suburbs » ?",o:["Le centre-ville","Les banlieues qui entourent le centre-ville","Le port"],a:1,e:"Les suburbs sont les banlieues qui entourent le centre-ville."},
{q:"Qu’est-ce qu’un ghetto ?",o:["Un quartier de luxe","Un quartier d’affaires","Un quartier dégradé où vivent des populations pauvres"],a:2,e:"Un ghetto est un quartier dégradé concentrant des populations pauvres."},
{q:"Skid Row est un quartier…",o:["Riche, en périphérie","Dégradé, au centre-ville","D’affaires, avec des gratte-ciel"],a:1,e:"Skid Row est un ghetto situé dans le centre de Los Angeles."},
{q:"Combien de sans-abri vivent à Skid Row ?",o:["300 à 600","3 000 à 6 000","30 000 à 60 000"],a:1,e:"Skid Row compte près de 20 000 habitants, dont 3 000 à 6 000 sans-abri."},
{q:"Quel quartier riche, sur les collines, est habité par de nombreuses stars de cinéma ?",o:["Skid Row","Beverly Hills","Le port"],a:1,e:"Beverly Hills est sur les collines, à la périphérie de Los Angeles."},
{q:"Qu’est-ce qu’un lotissement pavillonnaire ?",o:["Des gratte-ciel identiques","Des maisons de taille moyenne construites sur un même modèle","Un quartier de sans-abri"],a:1,e:"Ce sont des maisons de taille moyenne construites sur un même modèle."},
{q:"Sur quelle distance Los Angeles s’étend-elle aujourd’hui ?",o:["Moins de 50 km","Environ 100 km","Plus de 150 km"],a:2,e:"Los Angeles s’étend sur plus de 150 km."},
{q:"Comment les transports en commun peuvent-ils aider les populations pauvres ?",o:["En facilitant leur mobilité","En supprimant les autoroutes","En fermant le port"],a:0,e:"Ils facilitent la mobilité des populations pauvres, éloignées des zones d’emploi."}
];
var $=function(s){return document.querySelector(s)};
var start=$("#start"),game=$("#game"),end=$("#end");
var order,i,score,missed,locked;
var letters=["A","B","C"];

function shuffle(a){
  a=a.slice();
  for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t;}
  return a;
}
function show(el){
  [start,game,end].forEach(function(s){s.hidden=(s!==el)});
  window.scrollTo(0,0);
}
function begin(){
  order=shuffle(Q);i=0;score=0;missed=[];
  show(game);ask();
}
function ask(){
  locked=false;
  var q=order[i];
  $("#count").textContent="Question "+(i+1)+" sur "+order.length;
  $("#score").textContent="Score : "+score;
  $("#car").style.left=(i/order.length*100)+"%";
  $("#qtext").textContent=q.q;
  var box=$("#opts");box.innerHTML="";
  var opts=shuffle(q.o.map(function(t,k){return {t:t,ok:k===q.a}}));
  opts.forEach(function(o,k){
    var b=document.createElement("button");
    b.type="button";b.className="opt";b.dataset.ok=o.ok?"1":"0";
    b.innerHTML='<span class="l">'+letters[k]+'</span><span class="t"></span><span class="mark" aria-hidden="true"></span>';
    b.querySelector(".t").textContent=o.t;
    b.addEventListener("click",function(){pick(b,o,box)});
    box.appendChild(b);
  });
  $("#fb").hidden=true;
  $("#qtext").focus({preventScroll:true});
}
function pick(b,o,box){
  if(locked)return;
  locked=true;
  var q=order[i];
  box.querySelectorAll(".opt").forEach(function(x){
    x.disabled=true;
    if(x.dataset.ok==="1"){x.classList.add("ok");x.querySelector(".mark").textContent="✓";}
  });
  if(o.ok){score++;}else{b.classList.add("bad");b.querySelector(".mark").textContent="✗";missed.push(q);}
  $("#score").textContent="Score : "+score;
  $("#car").style.left=((i+1)/order.length*100)+"%";
  $("#verdict").textContent=o.ok?"Bonne réponse !":"Pas tout à fait.";
  $("#why").textContent=q.e;
  $("#next").textContent=(i===order.length-1)?"Voir le résultat":"Question suivante";
  $("#fb").hidden=false;
  $("#next").focus();
}
function finish(){
  var n=order.length;
  $("#final").textContent=score+" sur "+n;
  $("#msg").textContent=score>=n-1?"Excellent ! Los Angeles n’a plus de secrets.":(score>=Math.ceil(n*0.6)?"Bien joué ! Encore un effort pour le sans-faute.":"Un bon début. Relisez le cours et retentez.");
  var ul=$("#review");ul.innerHTML="";
  $("#revwrap").hidden=!missed.length;
  missed.forEach(function(q){
    var li=document.createElement("li");
    li.innerHTML="<strong></strong><span></span>";
    li.firstChild.textContent=q.q;
    li.lastChild.textContent="Réponse : "+q.o[q.a];
    ul.appendChild(li);
  });
  show(end);
}
$("#go").addEventListener("click",begin);
$("#again").addEventListener("click",begin);
$("#next").addEventListener("click",function(){
  if(i<order.length-1){i++;ask();window.scrollTo(0,0);}else{finish();}
});
})();
</script>
</body>
</html>
